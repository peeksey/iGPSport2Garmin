name: iGPSport to Garmin Sync

on:
  schedule:
    # Every 2 hours (UTC). Frequent runs risk Garmin rate limits.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: igpsport-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore Garmin session cache
        uses: actions/cache@v4
        with:
          path: garmin_session
          key: ${{ runner.os }}-garmin-tokens-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-garmin-tokens-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync script
        env:
          IGPSPORT_USERNAME: ${{ secrets.IGPSPORT_USERNAME }}
          IGPSPORT_PASSWORD: ${{ secrets.IGPSPORT_PASSWORD }}
          IGPSPORT_REGION: ${{ secrets.IGPSPORT_REGION || 'cn' }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_DOMAIN: ${{ secrets.GARMIN_DOMAIN || 'garmin.com' }}
        run: python sync_igpsport_to_garmin.py

      - name: Commit and push sync date
        if: always()
        run: |
          if [ ! -f last_sync_date.json ]; then
            echo "No sync date file yet, nothing to commit"
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_sync_date.json
          if git diff --staged --quiet; then
            echo "Sync date unchanged"
            exit 0
          fi
          git commit -m "Update last sync date [skip ci]"
          git push
